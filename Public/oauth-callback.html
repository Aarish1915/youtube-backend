<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VidTube — Signing in…</title>
  <style>
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #0f0f0f; color: #f1f1f1;
      font-family: 'Inter', sans-serif;
    }
    .msg { text-align: center; }
    .spinner {
      width: 40px; height: 40px; margin: 0 auto 16px;
      border: 3px solid #333; border-top-color: #3ea6ff;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="msg">
    <div class="spinner"></div>
    <p>Completing sign-in…</p>
  </div>
  <script>
    try {
      const params = new URLSearchParams(window.location.search);
      const accessToken = params.get('accessToken');
      const error = params.get('error');

      if (accessToken) {
        localStorage.setItem('accessToken', accessToken);
        const refToken = params.get('refreshToken');
        if (refToken) localStorage.setItem('refreshToken', refToken);
        
        window.location.replace('/?oauth=success');
      } else if (error) {
        window.location.replace('/?error=' + encodeURIComponent(error));
      } else {
        window.location.replace('/');
      }
    } catch (err) {
      document.querySelector('.msg').innerHTML = '<p style="color:red">Error: ' + err.message + '</p><br><a href="/" style="color:#3ea6ff">Click here to go Home</a>';
    }
  </script>
</body>
</html>
