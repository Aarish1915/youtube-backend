<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VidTube — Video Platform</title>
  <meta name="description" content="A modern video sharing platform. Upload, watch, comment, and share videos.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== Navbar ===== -->
  <header id="navbar">
    <div class="nav-start">
      <button class="icon-btn" id="sidebar-toggle" title="Menu">
        <span class="material-symbols-outlined">menu</span>
      </button>
      <a href="#/" class="logo" id="logo-link">
        <svg class="logo-svg" viewBox="0 0 90 20" width="90" height="20">
          <rect x="0" y="0" width="28" height="20" rx="4" fill="#ff0000"/>
          <polygon points="11,4 11,16 21,10" fill="#fff"/>
          <text x="33" y="15" fill="#fff" font-family="Inter,sans-serif" font-weight="700" font-size="16">VidTube</text>
        </svg>
      </a>
    </div>
    <div class="nav-center">
      <form class="search-form" id="search-form">
        <input type="text" id="search-input" placeholder="Search" autocomplete="off">
        <button type="submit" class="search-submit" title="Search">
          <span class="material-symbols-outlined">search</span>
        </button>
      </form>
    </div>
    <div class="nav-end" id="nav-end"></div>
  </header>

  <!-- ===== Sidebar ===== -->
  <aside id="sidebar" class="sidebar open">
    <nav class="sidebar-nav">
      <a href="#/" class="sidebar-link active" data-route="/">
        <span class="material-symbols-outlined">home</span>
        <span class="sidebar-label">Home</span>
      </a>
      <a href="#/upload" class="sidebar-link" data-route="/upload">
        <span class="material-symbols-outlined">video_call</span>
        <span class="sidebar-label">Upload</span>
      </a>
      <a href="#/history" class="sidebar-link" data-route="/history">
        <span class="material-symbols-outlined">history</span>
        <span class="sidebar-label">History</span>
      </a>
      <a href="#/profile" class="sidebar-link" data-route="/profile">
        <span class="material-symbols-outlined">account_circle</span>
        <span class="sidebar-label">Your Profile</span>
      </a>
    </nav>
    <div class="sidebar-bottom">
      <div class="health-indicator" id="health-indicator">
        <span class="health-dot" id="health-dot"></span>
        <span class="health-label" id="health-label">Connecting…</span>
      </div>
    </div>
  </aside>

  <!-- ===== Main Content Area ===== -->
  <main id="main-content" class="main-content sidebar-open"></main>

  <!-- ===== Auth Modal ===== -->
  <div id="auth-overlay" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="auth-card">
      <button class="close-btn" id="auth-close" title="Close">
        <span class="material-symbols-outlined">close</span>
      </button>
      <div class="auth-header">
        <svg viewBox="0 0 28 20" width="40" height="28">
          <rect width="28" height="20" rx="4" fill="#ff0000"/>
          <polygon points="11,4 11,16 21,10" fill="#fff"/>
        </svg>
        <h2>Welcome to VidTube</h2>
        <p>Sign in to upload videos, post comments, and more</p>
      </div>
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Sign In</button>
        <button class="auth-tab" data-tab="register">Sign Up</button>
      </div>
      <!-- Login -->
      <form id="login-form" class="auth-form">
        <div class="input-group">
          <span class="material-symbols-outlined input-icon">email</span>
          <input type="email" id="login-email" placeholder="Email address" required>
        </div>
        <div class="input-group">
          <span class="material-symbols-outlined input-icon">lock</span>
          <input type="password" id="login-password" placeholder="Password" required>
        </div>
        <button type="submit" class="btn-primary btn-full" id="login-submit">Sign In</button>
      </form>
      <!-- Register -->
      <form id="register-form" class="auth-form hidden">
        <div class="input-group">
          <span class="material-symbols-outlined input-icon">person</span>
          <input type="text" id="reg-fullname" placeholder="Full name" required>
        </div>
        <div class="input-group">
          <span class="material-symbols-outlined input-icon">alternate_email</span>
          <input type="text" id="reg-username" placeholder="Username" required>
        </div>
        <div class="input-group">
          <span class="material-symbols-outlined input-icon">email</span>
          <input type="email" id="reg-email" placeholder="Email address" required>
        </div>
        <div class="input-group">
          <span class="material-symbols-outlined input-icon">lock</span>
          <input type="password" id="reg-password" placeholder="Password (min 6 characters)" required minlength="6">
        </div>
        <button type="submit" class="btn-primary btn-full" id="register-submit">Create Account</button>
      </form>
      <div class="auth-divider"><span>or</span></div>
      <a href="/api/v1/auth/google" class="btn-google">
        <svg viewBox="0 0 48 48" width="20" height="20">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continue with Google
      </a>
      <div id="auth-msg" class="auth-msg hidden"></div>
    </div>
  </div>

  <!-- ===== Toast Container ===== -->
  <div id="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
